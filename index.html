<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projekte & Assistenz-Tools</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #ffffff;
    }
    p.subtitle {
      color: #8b949e;
      margin-bottom: 2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 500px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }
    .card h2 {
      font-size: 1.1rem;
      margin: 0 0 8px 0;
      color: #ffffff;
    }
    .card p {
      font-size: 0.85rem;
      color: #8b949e;
      margin: 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Projekt-Übersicht</h1>
    <p class="subtitle">Wähle ein Tool aus, um die Anwendung zu starten:</p>

    <div class="grid">
      <a href="./arbeitszeit-assistent/" class="card">
        <div class="icon">⏱️</div>
        <h2>Arbeitszeit-Assistent</h2>
        <p>Ermittelt Arbeitsschluss, Arbeitszeiten und Pausen.</p>
      </a>

      <a href="./berichtsheft-berufsschule-assistent/" class="card">
        <div class="icon">📝</div>
        <h2>Berichtsheft-Assistent</h2>
        <p>Unterstützung beim Verfassen des Berichtshefts.</p>
      </a>
    </div>
  </div>
</body>
</html>
